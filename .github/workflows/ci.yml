name: ci

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test,dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy core
        run: mypy src/flink_etl_udfs/core
      - name: Tests
        run: pytest --cov=flink_etl_udfs.core --cov-report=term-missing
