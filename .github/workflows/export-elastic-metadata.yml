name: export-elastic-metadata

on:
  push:
    branches:
      - main
      - metadata/elastic-v0.7.1
      - feat/normalizer-try-parse-philosophy
    paths:
      - scripts/export_elastic_metadata.py
      - scripts/export_elastic_metadata_contracts.py
      - src/flink_etl_udfs/public_api.py
      - src/flink_etl_udfs/normalizer_contracts.py
      - .github/workflows/export-elastic-metadata.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate metadata
        run: PYTHONPATH=src python scripts/export_elastic_metadata_contracts.py
      - name: Commit generated metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add metadata/flink_transform_functions_elastic_v0.7.1.json
          git add metadata/flink_transform_functions_elastic_v0.7.1.bulk.ndjson
          if ! git diff --cached --quiet; then
            git commit -m 'chore: generate Elasticsearch metadata v0.7.1'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
